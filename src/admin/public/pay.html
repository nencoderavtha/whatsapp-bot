<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>UPI Payment Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: { fontFamily: { sans: ["Outfit", "sans-serif"] } } },
    };
  </script>
  <style>
    .glass {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col justify-center items-center font-sans p-6">
  
  <div class="glass w-full max-w-sm rounded-3xl p-8 shadow-2xl relative overflow-hidden flex flex-col items-center">
    <!-- Glowing background accents -->
    <div class="absolute w-64 h-64 rounded-full bg-emerald-500/10 blur-3xl -top-20 -left-20 pointer-events-none"></div>
    <div class="absolute w-64 h-64 rounded-full bg-rose-500/10 blur-3xl -bottom-20 -right-20 pointer-events-none"></div>

    <!-- Gateway Icon -->
    <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 mb-6 relative">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
    </div>

    <!-- Amount Display -->
    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-1">Total Amount</h2>
    <h1 id="amount-text" class="text-4xl font-extrabold text-white mb-6">₹0.00</h1>

    <div class="w-full border-t border-slate-800/80 pt-6 mb-8 text-center space-y-2">
      <p id="merchant-name" class="text-sm font-semibold text-slate-200">Merchant: Loading...</p>
      <p id="upi-id" class="text-xs text-slate-500 font-mono">UPI: Loading...</p>
    </div>

    <!-- Payment Button Actions -->
    <div class="w-full space-y-3.5 z-10">
      <!-- Universal UPI Launcher -->
      <a id="pay-btn" href="#" class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-center block shadow-lg hover:shadow-emerald-500/15 transition-all text-sm">
        Pay via UPI Apps
      </a>

      <!-- Quick Individual Launchers (deep link options for GPay / PhonePe) -->
      <div class="grid grid-cols-2 gap-3 text-center">
        <a id="gpay-btn" href="#" class="py-2.5 px-3 rounded-xl border border-slate-800 bg-slate-900/40 hover:bg-slate-900/80 transition-colors text-xs font-semibold text-slate-300">
          Google Pay
        </a>
        <a id="phonepe-btn" href="#" class="py-2.5 px-3 rounded-xl border border-slate-800 bg-slate-900/40 hover:bg-slate-900/80 transition-colors text-xs font-semibold text-slate-300">
          PhonePe
        </a>
      </div>
    </div>

    <p class="text-slate-600 text-[10px] mt-8 text-center max-w-[240px]">
      Secured standard UPI payment. Once payment is made, your order confirms automatically on the bot.
    </p>
  </div>

  <script>
    // Extract query parameters
    const params = new URLSearchParams(window.location.search);
    const pa = params.get('pa') || '';
    const pn = params.get('pn') || 'Restaurant';
    const am = params.get('am') || '0';
    const tn = params.get('tn') || 'WhatsApp Order';

    const merchantName = decodeURIComponent(pn);
    const amount = Number(am);

    // Update UI elements
    document.getElementById('amount-text').textContent = `₹${amount.toFixed(2)}`;
    document.getElementById('merchant-name').textContent = `Merchant: ${merchantName}`;
    document.getElementById('upi-id').textContent = `UPI: ${pa}`;

    if (pa) {
      const upiLink = `upi://pay?pa=${pa}&pn=${encodeURIComponent(merchantName)}&am=${amount}&tn=${encodeURIComponent(tn)}&cu=INR`;
      
      // Standard UPI action button
      document.getElementById('pay-btn').href = upiLink;

      // Specific app launchers (custom schemes for some platforms, fallback to raw UPI)
      document.getElementById('gpay-btn').href = upiLink;
      document.getElementById('phonepe-btn').href = upiLink;

      // Attempt to auto-redirect the client browser instantly to launchers on mobile
      setTimeout(() => {
        window.location.href = upiLink;
      }, 500);
    }
  </script>
</body>
</html>
