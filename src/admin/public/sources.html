<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sources</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: { fontFamily: { sans: ["Outfit", "sans-serif"] } } },
    };
  </script>
  <style>
    .modal-backdrop {
      background-color: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .bottom-sheet {
      border-radius: 24px 24px 0 0;
      animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .item-card {
      transition: all 0.2s ease;
    }
    .item-card:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full flex flex-col justify-end font-sans overflow-hidden">

  <!-- Backdrop overlay -->
  <div class="modal-backdrop absolute inset-0 z-0"></div>

  <!-- Bottom Sheet Modal Panel -->
  <div class="bottom-sheet w-full bg-slate-900 border-t border-slate-800/80 max-h-[85vh] flex flex-col relative z-10 shadow-2xl pb-safe">
    
    <!-- Drag Handle Indicator -->
    <div class="w-12 h-1 bg-slate-700/80 rounded-full mx-auto my-3.5 shrink-0"></div>

    <!-- Header Section -->
    <header class="px-6 pb-4 border-b border-slate-800/50 flex justify-between items-center shrink-0">
      <h2 id="sheet-title" class="text-lg font-bold tracking-tight text-white">Sources</h2>
      <!-- Close button redirects/closes window -->
      <button onclick="closeSheet()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </header>

    <!-- Source List Body -->
    <div id="sources-container" class="overflow-y-auto px-4 py-4 flex-1 space-y-2">
      <!-- Loading Skeleton -->
      <div id="loading" class="space-y-3 py-4">
        <div class="h-14 bg-slate-800/40 animate-pulse rounded-2xl"></div>
        <div class="h-14 bg-slate-800/40 animate-pulse rounded-2xl"></div>
        <div class="h-14 bg-slate-800/40 animate-pulse rounded-2xl"></div>
      </div>
    </div>
  </div>

  <script>
    // Extract query parameters
    const params = new URLSearchParams(window.location.search);
    const title = params.get('title') || 'Sources';
    const itemsRaw = params.get('items');

    document.getElementById('sheet-title').textContent = title;

    function renderSources() {
      const container = document.getElementById('sources-container');
      container.innerHTML = '';

      let items = [];
      try {
        if (itemsRaw) {
          items = JSON.parse(decodeURIComponent(itemsRaw));
        }
      } catch (e) {
        console.error("Failed to parse items query param:", e);
      }

      if (items.length === 0) {
        // Fallback demo items if none passed in query string (for easy developer preview)
        items = [
          {
            title: "Domestic Release Schedule",
            domain: "boxofficemojo.com",
            url: "https://boxofficemojo.com"
          },
          {
            title: "New Kids & Family Movies Coming Out 2026",
            domain: "parade.com",
            url: "https://parade.com"
          },
          {
            title: "Best new films of 2026: 26 movies to look for",
            domain: "radiotimes.com",
            url: "https://radiotimes.com"
          },
          {
            title: "Upcoming 2026 movies",
            domain: "imdb.com",
            url: "https://imdb.com"
          }
        ];
      }

      items.forEach(item => {
        const link = document.createElement('a');
        link.href = item.url || '#';
        link.target = "_blank";
        link.className = "item-card flex items-center gap-4 p-3.5 rounded-2xl border border-slate-800/30 bg-slate-900/40 hover:border-slate-700/50 transition-all";

        // Icon construction (using google favicons service)
        const iconWrapper = document.createElement('div');
        iconWrapper.className = "w-10 h-10 rounded-xl bg-slate-850 border border-slate-800/60 flex items-center justify-center shrink-0 overflow-hidden";
        
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${item.domain}&sz=64`;
        const img = document.createElement('img');
        img.src = faviconUrl;
        img.className = "w-5 h-5 object-contain";
        img.onerror = () => {
          img.src = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox%3D'0 0 24 24' fill%3D'none' stroke%3D'%2394a3b8' stroke-width%3D'2'%3E%3Cpath stroke-linecap%3D'round' stroke-linejoin%3D'round' d%3D'M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1' %2F%3E%3C%2Fsvg%3E";
        };
        iconWrapper.appendChild(img);
        link.appendChild(iconWrapper);

        // Content
        const content = document.createElement('div');
        content.className = "flex-1 min-w-0";

        const titleText = document.createElement('h3');
        titleText.className = "text-sm font-semibold tracking-tight text-white truncate";
        titleText.textContent = item.title;
        content.appendChild(titleText);

        const domainText = document.createElement('p');
        domainText.className = "text-xs text-slate-500 truncate mt-0.5";
        domainText.textContent = item.domain;
        content.appendChild(domainText);

        link.appendChild(content);

        // Arrow indicator
        const arrow = document.createElement('div');
        arrow.className = "text-slate-600 shrink-0";
        arrow.innerHTML = `
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        `;
        link.appendChild(arrow);

        container.appendChild(link);
      });
    }

    function closeSheet() {
      const panel = document.querySelector('.bottom-sheet');
      panel.style.animation = 'slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards';
      setTimeout(() => {
        // Go back in history or close window
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.close();
        }
      }, 250);
      
      // Dynamic keyframes injection for slideDown
      if (!document.getElementById('slide-down-style')) {
        const style = document.createElement('style');
        style.id = 'slide-down-style';
        style.innerHTML = `
          @keyframes slideDown {
            from { transform: translateY(0); }
            to { transform: translateY(100%); }
          }
        `;
        document.head.appendChild(style);
      }
    }

    // Render list
    setTimeout(renderSources, 600); // Small delay to show smooth layout transit
  </script>
</body>
</html>
