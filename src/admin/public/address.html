<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pin Delivery Location — Godavari Ruchulu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>/* GOOGLE_MAPS_KEY_PLACEHOLDER */</script>
  <style>
    body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #map { height: 100vh; width: 100vw; position: absolute; inset: 0; z-index: 0; }
    .glass-card { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(20px); }
    .slide-up { transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    .pac-container { z-index: 10000 !important; background-color: #0f172a !important; border: 1px solid #1e293b !important; border-radius: 1rem !important; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5) !important; color: #fff !important; font-family: inherit !important; }
    .pac-item { padding: 10px 14px !important; color: #cbd5e1 !important; border-top: 1px solid #1e293b !important; cursor: pointer !important; }
    .pac-item:hover, .pac-item-selected { background-color: #1e293b !important; color: #ffffff !important; }
    .pac-item-query { font-size: 13px !important; color: #ffffff !important; font-weight: bold !important; }
    .pac-matched { color: #f43f5e !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans relative overflow-hidden">

  <!-- Full Screen Map -->
  <div id="map"></div>

  <!-- Top Search Bar Container -->
  <div class="absolute top-4 left-4 right-4 z-20 max-w-md mx-auto">
    <div class="glass-card rounded-2xl p-2 border border-slate-700/80 shadow-2xl flex items-center gap-2">
      <span class="text-slate-400 pl-2 text-sm">🔍</span>
      <input type="text" id="search-input" oninput="handleSearchInput(event)" placeholder="Search area, locality or landmark in Hyderabad..."
        class="w-full bg-transparent text-xs text-white placeholder:text-slate-400 focus:outline-none py-1.5" />
      <button onclick="clearSearch()" id="btn-clear" class="hidden text-slate-400 hover:text-white px-2 text-xs">✕</button>
    </div>
  </div>

  <!-- Floating GPS Button -->
  <button id="btn-gps" onclick="locateGPS()" class="absolute bottom-24 right-4 z-20 bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold text-xs px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 transition-all">
    🎯 Locate Me
  </button>

  <!-- Floating Bottom Bar: Step 1 (Confirm Pin) -->
  <div id="pin-confirm-bar" class="absolute bottom-0 left-0 right-0 z-20 p-4 bg-gradient-to-t from-slate-950 via-slate-950/90 to-transparent">
    <div class="max-w-md mx-auto space-y-2">
      <div class="glass-card p-3 rounded-2xl border border-slate-800 text-center">
        <p id="area-preview" class="text-xs text-slate-300 font-medium truncate">Fetching pinned area location...</p>
      </div>
      <button onclick="proceedToAddressForm()" class="w-full bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-extrabold py-3.5 rounded-2xl text-sm transition-all shadow-2xl flex items-center justify-center gap-2">
        📍 Confirm Location & Fill Flat No ➔
      </button>
    </div>
  </div>

  <!-- Slide-up Full Address Form Sheet: Step 2 -->
  <div id="address-sheet" class="absolute bottom-0 left-0 right-0 z-30 transform translate-y-full slide-up max-h-[90vh] overflow-y-auto glass-card rounded-t-3xl border-t border-slate-800 p-5 space-y-4 shadow-2xl">
    <div class="max-w-md mx-auto space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <h2 class="text-base font-extrabold text-white flex items-center gap-2">
            <span>📍</span> Delivery Address Details
          </h2>
          <p class="text-[11px] text-slate-400 mt-0.5">Fill in house / flat details to dispatch your order</p>
        </div>
        <button onclick="closeAddressForm()" class="text-xs font-bold text-rose-400 hover:text-rose-300 bg-rose-950/60 px-3 py-1.5 rounded-xl border border-rose-500/30">
          ← Edit Map Pin
        </button>
      </div>

      <form id="address-form" onsubmit="submitAddress(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1 uppercase tracking-wider">Pinned Area</label>
          <textarea id="fullAddress" rows="2" readonly
            class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-3.5 py-2 text-[11px] text-slate-300 focus:outline-none cursor-not-allowed resize-none"></textarea>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1 uppercase tracking-wider">Flat / House / Door No. *</label>
          <input type="text" id="flatNo" required placeholder="e.g. Flat 402, Door No 8-2-293"
            class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:ring-2 focus:ring-rose-500/60 transition-all placeholder:text-slate-600" />
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-300 mb-1 uppercase tracking-wider">Building / Apartment / Colony Name *</label>
          <input type="text" id="buildingName" required placeholder="e.g. Bhavani Residency, Prashant Hills"
            class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:ring-2 focus:ring-rose-500/60 transition-all placeholder:text-slate-600" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold text-slate-300 mb-1 uppercase tracking-wider">Landmark</label>
            <input type="text" id="landmark" placeholder="e.g. Near D-Mart"
              class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:ring-2 focus:ring-rose-500/60 transition-all placeholder:text-slate-600" />
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-300 mb-1 uppercase tracking-wider">Pincode</label>
            <input type="text" id="pincode" placeholder="e.g. 500081" value="500081"
              class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:ring-2 focus:ring-rose-500/60 transition-all placeholder:text-slate-600" />
          </div>
        </div>

        <input type="hidden" id="lat" value="17.4380">
        <input type="hidden" id="lng" value="78.4050">

        <button type="submit" id="btn-submit" class="w-full bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-extrabold py-3.5 rounded-2xl text-sm transition-all shadow-xl flex items-center justify-center gap-2 mt-3">
          ✅ Save & Return to WhatsApp
        </button>
      </form>
    </div>
  </div>

  <!-- Success Card -->
  <div id="success-card" class="hidden fixed inset-0 z-40 glass-card p-6 flex flex-col items-center justify-center text-center space-y-4">
    <div class="w-16 h-16 rounded-3xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-4xl mx-auto shadow-2xl">🎉</div>
    <h2 class="text-xl font-extrabold text-emerald-400">Delivery Address Saved!</h2>
    <p id="success-msg" class="text-xs text-slate-300 max-w-sm px-4">Your delivery location has been pinned and updated in WhatsApp.</p>
    <p class="text-[11px] text-slate-500">You can now close this tab and return to WhatsApp to complete your order.</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const customerPhone = urlParams.get("phone") || "";

    let curLat = 17.4380;
    let curLng = 78.4050;

    let gMap = null;
    let gMarker = null;
    let gGeocoder = null;
    let gAutocomplete = null;

    const googleApiKey = window.GOOGLE_MAPS_API_KEY || "";

    function showMapError(msg) {
      const el = document.getElementById("area-preview");
      el.textContent = msg;
      el.classList.add("text-rose-400");
    }

    if (googleApiKey) {
      window.initGoogleMaps = function () {
        initGoogleEngine();
        // GPS is requested only after the map exists. Previously locateGPS() ran
        // at parse time, before the async Maps script had loaded, so its success
        // handler had no map or marker to move.
        locateGPS();
      };
      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=${googleApiKey}&libraries=places&callback=initGoogleMaps`;
      script.async = true;
      script.onerror = function () {
        showMapError("Map failed to load. Please check your connection and reload.");
      };
      document.head.appendChild(script);
    } else {
      showMapError("Map unavailable — GOOGLE_MAPS_API_KEY is not configured.");
    }

    function initGoogleEngine() {
      const container = document.getElementById("map");
      container.innerHTML = "";

      gMap = new google.maps.Map(container, {
        center: { lat: curLat, lng: curLng },
        zoom: 16,
        disableDefaultUI: true,
        zoomControl: false,
      });

      gMarker = new google.maps.Marker({
        position: { lat: curLat, lng: curLng },
        map: gMap,
        draggable: true,
        animation: google.maps.Animation.DROP,
      });

      gGeocoder = new google.maps.Geocoder();

      gMarker.addListener("dragend", function () {
        const pos = gMarker.getPosition();
        updateCoords(pos.lat(), pos.lng());
      });

      gMap.addListener("click", function (e) {
        gMarker.setPosition(e.latLng);
        updateCoords(e.latLng.lat(), e.latLng.lng());
      });

      const searchInput = document.getElementById("search-input");
      gAutocomplete = new google.maps.places.Autocomplete(searchInput, {
        componentRestrictions: { country: "in" },
        fields: ["geometry", "formatted_address", "name"],
      });

      gAutocomplete.addListener("place_changed", function () {
        const place = gAutocomplete.getPlace();
        if (!place.geometry || !place.geometry.location) return;

        const lat = place.geometry.location.lat();
        const lng = place.geometry.location.lng();

        gMap.setCenter({ lat, lng });
        gMap.setZoom(17);
        gMarker.setPosition({ lat, lng });

        updateCoords(lat, lng);
      });

      // Resolve the starting pin straight away. "Pinned Area" is readonly, so if
      // nothing ever geocodes — customer declines GPS and doesn't move the pin —
      // it stays blank, cannot be typed into, and the saved address loses its area.
      updateCoords(curLat, curLng);
    }

    function updateCoords(lat, lng) {
      curLat = lat;
      curLng = lng;
      document.getElementById("lat").value = lat.toFixed(6);
      document.getElementById("lng").value = lng.toFixed(6);

      if (!gGeocoder) return;

      gGeocoder.geocode({ location: { lat, lng } }, (results, status) => {
        if (status === "OK" && results && results[0]) {
          const formatted = results[0].formatted_address;
          document.getElementById("fullAddress").value = formatted;
          document.getElementById("area-preview").textContent = formatted;

          const postalComp = results[0].address_components.find((c) => c.types.includes("postal_code"));
          if (postalComp) {
            document.getElementById("pincode").value = postalComp.long_name;
          }
        } else {
          // Still give the courier the coordinates rather than an empty area.
          const fallback = `GPS Pin (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
          document.getElementById("fullAddress").value = fallback;
          document.getElementById("area-preview").textContent = fallback;
        }
      });
    }

    function locateGPS() {
      const btn = document.getElementById("btn-gps");
      btn.textContent = "⏳ Locating...";

      if (!navigator.geolocation) {
        btn.textContent = "🎯 Locate Me";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          curLat = pos.coords.latitude;
          curLng = pos.coords.longitude;

          if (gMap && gMarker) {
            gMap.setCenter({ lat: curLat, lng: curLng });
            gMap.setZoom(17);
            gMarker.setPosition({ lat: curLat, lng: curLng });
          }

          updateCoords(curLat, curLng);
          btn.textContent = "🎯 Locate Me";
        },
        () => {
          // Keep the default pin — the customer can drag or search instead. No
          // alert here: it fired on page load and blocked the whole form.
          btn.textContent = "🎯 Locate Me";
        },
        { enableHighAccuracy: true },
      );
    }

    // Google Places Autocomplete drives the search box itself; these two just
    // manage the clear button, which the markup wires to oninput/onclick.
    function handleSearchInput(e) {
      const clearBtn = document.getElementById("btn-clear");
      if (e.target.value.trim().length > 0) clearBtn.classList.remove("hidden");
      else clearBtn.classList.add("hidden");
    }

    function clearSearch() {
      document.getElementById("search-input").value = "";
      document.getElementById("btn-clear").classList.add("hidden");
    }

    function proceedToAddressForm() {
      document.getElementById("address-sheet").classList.remove("translate-y-full");
    }

    function closeAddressForm() {
      document.getElementById("address-sheet").classList.add("translate-y-full");
    }

    async function submitAddress(e) {
      e.preventDefault();
      const flat = document.getElementById("flatNo").value.trim();
      const bldg = document.getElementById("buildingName").value.trim();
      const lmark = document.getElementById("landmark").value.trim();
      const pin = document.getElementById("pincode").value.trim();
      const area = document.getElementById("fullAddress").value.trim();
      const lat = parseFloat(document.getElementById("lat").value);
      const lng = parseFloat(document.getElementById("lng").value);

      // Area is readonly, so an empty value means geocoding never ran. Sending it
      // would save a half-formed address a courier can't use.
      if (!area) {
        alert("Please pin your location on the map first.");
        return;
      }

      const fullFormattedAddress = `${flat}, ${bldg}${lmark ? `, Near ${lmark}` : ""}, ${area} - ${pin}`;

      const btn = document.getElementById("btn-submit");
      btn.disabled = true;
      btn.textContent = "Saving Location...";

      try {
        const res = await fetch("/public/api/customer/address", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            phone: customerPhone,
            address: fullFormattedAddress,
            lat,
            lng,
          }),
        });

        if (res.ok) {
          document.getElementById("address-sheet").classList.add("translate-y-full");
          document.getElementById("success-card").classList.remove("hidden");
          document.getElementById("success-msg").textContent = `Delivery Address Saved: ${fullFormattedAddress}`;
        } else {
          alert("Could not save address. Please try again.");
          btn.disabled = false;
          btn.textContent = "✅ Save & Return to WhatsApp";
        }
      } catch (err) {
        alert("Network error. Please try again.");
        btn.disabled = false;
        btn.textContent = "✅ Save & Return to WhatsApp";
      }
    }
  </script>
</body>
</html>
